services:
  - type: web
    name: bojui-bird
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LIFF_ID
        sync: false
      # 前後端同一個服務不用填；之後若把前端搬去別的網域再設
      - key: ALLOWED_ORIGINS
        value: ""
      # @不揪鳥 閒聊：AI Studio key，多把逗號分隔，先用這些。留空＝關閉閒聊
      - key: GEMINI_API_KEYS
        sync: false
      # 填了 GOOGLE_CLOUD_PROJECT 就把 Vertex AI 接在上面 key 後面墊底；GCP_SA_JSON 貼服務帳號 JSON
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: "global"
      - key: GCP_SA_JSON
        sync: false
