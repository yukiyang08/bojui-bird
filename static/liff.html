<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>不揪鳥排行榜</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mascot"></div>
    <div class="hd-text">
      <h1>不揪鳥</h1>
      <p class="say" id="say"></p>
    </div>
    <button class="head-add" data-act="add"><iconify-icon icon="lucide:feather"></iconify-icon>記一筆</button>
  </header>
  <div id="app"><p class="state"><iconify-icon icon="lucide:loader"></iconify-icon>載入中</p></div>
</div>

<script src="ui.js"></script>
<script>
// 若前端與後端分開部署（例如前端放 Vercel、後端放 Render），
// 把這裡改成後端網址，例如 "https://bojui-bird.onrender.com"；同源部署留空字串即可。
const API_BASE = "";

const state = { groupId: null, data: null };
const app = document.getElementById("app");

// ngrok 免費網域會對瀏覽器請求插入警告頁，這個 header 可略過它
function apiFetch(url, opts = {}) {
  return fetch(API_BASE + url, {
    ...opts,
    headers: { "ngrok-skip-browser-warning": "true", ...(opts.headers || {}) },
  });
}

initChrome();

// 讀 URL 參數；LIFF 有時會把原始 query 收進 liff.state，兩個地方都找
function queryParam(name) {
  const q = new URLSearchParams(location.search);
  if (q.get(name)) return q.get(name);
  const state = q.get("liff.state");
  if (state) {
    const inner = new URLSearchParams(state[0] === "?" ? state.slice(1) : state);
    if (inner.get(name)) return inner.get(name);
  }
  return null;
}

async function reloadData() {
  const data = await apiFetch(`/api/leaderboard/${state.groupId}`).then((r) => r.json());
  render(data);
}

async function apiCall(method, url, body) {
  const res = await apiFetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.detail || `錯誤 ${res.status}`);
  return j;
}

let step = "start";
async function main() {
  step = "fetch /api/config";
  const cfg = await apiFetch(`/api/config`).then((r) => r.json());
  if (!cfg.liffId) return showState("confused", "尚未設定 LIFF_ID");

  step = "liff.init (id=" + cfg.liffId + ")";
  await liff.init({ liffId: cfg.liffId });

  step = "resolve group";
  const ctx = liff.getContext();
  // group id 優先從連結帶的 ?group= 拿（bot 產生，一定正確）；
  // getContext().groupId 只當備援 —— 未連結 bot 時它會給假的 id。
  const urlGroup = queryParam("group");
  const groupId = urlGroup || (ctx && ctx.groupId) || "";
  apiFetch("/api/debug", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ctx, urlGroup, isInClient: liff.isInClient() }),
  }).catch(() => {});
  if (!groupId) {
    return showState("sleepy", "請從群組裡的「!排行榜」連結開啟這個頁面");
  }

  step = "reloadData";
  state.groupId = groupId;
  wireClicks();
  await reloadData();
}

main().catch((err) => showState("sad", "載入失敗 @ " + step + "：" + (err && err.message || err)));
</script>
</body>
</html>
