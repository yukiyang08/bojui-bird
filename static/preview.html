<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>不揪鳥排行榜（樣式預覽）</title>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --line: #e7e7e2;
    --ink: #1b1b19;
    --ink-2: #78776f;
    --accent: #4f46e5;
    --pos: #15803d;
    --neg: #b4231d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111112;
      --surface: #1a1a1b;
      --line: #2c2c2e;
      --ink: #ececea;
      --ink-2: #8d8d85;
      --accent: #8b85f0;
      --pos: #46c37b;
      --neg: #ef6b63;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 22px 14px calc(40px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 440px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 8px; padding: 0 2px 4px; margin-bottom: 14px; }
  header > iconify-icon { font-size: 22px; color: var(--ink); }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  .head-add {
    margin-left: auto;
    display: flex; align-items: center; gap: 5px;
    padding: 7px 12px 7px 10px; border-radius: 999px;
    border: none; background: var(--accent); color: #fff;
    font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
  }
  .head-add:active { filter: brightness(0.94); }
  .head-add iconify-icon { font-size: 15px; }

  .label {
    font-size: 12px; font-weight: 600; color: var(--ink-2);
    letter-spacing: 0.03em;
    margin: 22px 6px 7px;
  }
  .label:first-of-type { margin-top: 4px; }

  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .line {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    padding: 12px 14px;
    background: none; border: none;
    font: inherit; color: inherit; text-align: left;
  }
  .line + .line { border-top: 1px solid var(--line); }
  button.line { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button.line:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }

  .line .ico { font-size: 18px; color: var(--ink-2); flex: none; }
  .line .chev { font-size: 18px; color: var(--ink-2); opacity: 0.55; flex: none; margin: 0 -2px 0 -4px; }

  .main { flex: 1; min-width: 0; }
  .main .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main .sub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .rank {
    flex: none; width: 20px; text-align: center;
    font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600;
    color: var(--ink-2);
  }
  .line.first .rank { color: var(--accent); }
  .line.first .name { font-weight: 650; }

  .trail { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .pts { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pts.big { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; }
  .money { font-size: 12px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .money.back { color: var(--pos); }
  .pts.pos { color: var(--pos); }
  .pts.neg { color: var(--neg); }
  .pts.zero { color: var(--ink-2); }
  .meta { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .val { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .val.strong { color: var(--ink); font-weight: 650; font-size: 15px; }

  .row-empty { padding: 15px 14px; color: var(--ink-2); font-size: 13px; }

  .foot { text-align: center; color: var(--ink-2); font-size: 12px; margin-top: 18px; }
  .state { text-align: center; color: var(--ink-2); font-size: 14px; margin-top: 72px; }
  .state iconify-icon { font-size: 30px; display: block; margin: 0 auto 10px; }

  /* sheet */
  .backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0, 0, 0, 0.38);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity 0.18s ease;
  }
  .backdrop.show { opacity: 1; }
  .sheet {
    width: 100%; max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(101%);
    transition: transform 0.24s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .backdrop.show .sheet { transform: none; }
  @media (prefers-reduced-motion: reduce) { .backdrop, .sheet { transition: none; } }
  .sheet h3 { margin: 0 0 16px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .sheet h3 iconify-icon { font-size: 17px; color: var(--ink-2); }
  .fld { margin-bottom: 13px; }
  .fld > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .fld input, .fld select {
    width: 100%; font: inherit; color: var(--ink);
    padding: 10px 11px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg);
    -webkit-appearance: none; appearance: none;
  }
  .fld input:focus, .fld select:focus { outline: none; border-color: var(--accent); }

  .step { display: flex; align-items: center; gap: 12px; }
  .step button {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  .step button iconify-icon { font-size: 17px; }
  .step .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
  .step .v.pos { color: var(--pos); }
  .step .v.neg { color: var(--neg); }

  .acts { display: flex; gap: 9px; margin-top: 6px; }
  .btn {
    padding: 11px 14px; border-radius: 10px; border: 1px solid transparent;
    font: inherit; font-weight: 650; cursor: pointer;
  }
  .btn.primary { flex: 1; background: var(--accent); color: #fff; }
  .btn.ghost {
    flex: none; background: none; border-color: var(--line); color: var(--neg);
    display: flex; align-items: center; gap: 5px;
  }
  .btn.ghost iconify-icon { font-size: 16px; }
  .btn:disabled { opacity: 0.5; }
  .err { color: var(--neg); font-size: 13px; margin: 10px 0 0; min-height: 1em; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <iconify-icon icon="lucide:bird"></iconify-icon>
    <h1>不揪鳥</h1>
    <button class="head-add" data-act="add"><iconify-icon icon="lucide:plus"></iconify-icon>新增功績</button>
  </header>
  <div id="app"></div>
  <p class="foot" style="margin-top:24px">樣式預覽 · 假資料，所有編輯只在本機生效</p>
</div>

<script>
const state = { groupId: "demo", data: null };
const app = document.getElementById("app");

const ICON = {
  target: "lucide:target",
  chev: "lucide:chevron-right",
};

const DB = {
  dinner_target: 12000,
  members: [
    { line_user_id: "U_ken", display_name: "Ken" },
    { line_user_id: "U_ming", display_name: "小明" },
    { line_user_id: "U_mei", display_name: "小美" },
    { line_user_id: "U_zhe", display_name: "阿哲" },
    { line_user_id: "U_fei", display_name: "阿肥" },
    { line_user_id: "U_wang", display_name: "老王" },
    { line_user_id: "U_dou", display_name: "土豆" },
    { line_user_id: "U_mimi", display_name: "咪咪" },
  ],
  ranking: [
    { display_name: "老王", total_points: 8 },
    { display_name: "小美", total_points: 5 },
    { display_name: "阿哲", total_points: 3 },
    { display_name: "Ken", total_points: 1 },
    { display_name: "土豆", total_points: 0 },
    { display_name: "阿肥", total_points: -1 },
    { display_name: "咪咪", total_points: -3 },
    { display_name: "小明", total_points: -6 },
  ],
  merit_log: [
    { id: "m1", display_name: "老王", delta: 2, reason: "買整團手搖", created_at: "2026-08-27T10:00:00Z" },
    { id: "m2", display_name: "小美", delta: 1, reason: "揪聚餐訂位", created_at: "2026-08-26T12:00:00Z" },
    { id: "m3", display_name: "阿哲", delta: 1, reason: "", created_at: "2026-08-25T09:00:00Z" },
  ],
  sin_log: [
    { id: "s1", display_name: "小明", delta: -1, reason: "遲到 40 分鐘", created_at: "2026-08-27T09:20:00Z" },
    { id: "s2", display_name: "咪咪", delta: -2, reason: "放鳥", created_at: "2026-08-26T20:00:00Z" },
    { id: "s3", display_name: "阿肥", delta: -1, reason: "已讀不回", created_at: "2026-08-24T18:00:00Z" },
  ],
};

document.addEventListener("click", (ev) => {
  const row = ev.target.closest("[data-kind]");
  if (row) return openEditSheet(row.dataset.kind, row.dataset.id);
  const act = ev.target.closest("[data-act]");
  if (act && act.dataset.act === "target") return openTargetSheet();
  if (act && act.dataset.act === "add") return openAddSheet();
});
reload();

async function reload() {
  const data = JSON.parse(JSON.stringify(DB));
  const ranked = data.ranking.slice().sort((a, b) => b.total_points - a.total_points);
  const pays =
    data.dinner_target && ranked.length
      ? calcSettlement(ranked.map((m) => m.total_points), data.dinner_target)
      : null;
  data.ranking = ranked.map((m, i) => ({ ...m, pay: pays ? pays[i] : null }));
  render(data);
}

// 依分數分攤：分數越高付越少，權重都 >= 1 所以不會有人是負的（退錢）
function calcSettlement(points, amount) {
  const n = points.length;
  if (!n) return [];
  const top = Math.max(...points);
  const w = points.map((p) => top - p + 1);
  const tw = w.reduce((a, b) => a + b, 0);
  const pays = w.map((x) => Math.round((amount * x) / tw));
  let big = 0;
  pays.forEach((p, i) => {
    if (p > pays[big]) big = i;
  });
  pays[big] += amount - pays.reduce((a, b) => a + b, 0);
  return pays;
}

// 假 API：直接改本機 DB
async function api(method, url, body) {
  if (url === "/api/target" && method === "PUT") {
    DB.dinner_target = body.amount;
    return { ok: true };
  }
  if (url === "/api/records" && method === "POST") {
    const name = (DB.members.find((m) => m.line_user_id === body.target_user_id) || {}).display_name || "?";
    const rec = { id: "x" + Date.now(), display_name: name, delta: body.delta, reason: (body.reason || "").trim(), created_at: new Date().toISOString() };
    DB[body.delta > 0 ? "merit_log" : "sin_log"].unshift(rec);
    const r = DB.ranking.find((m) => m.display_name === name);
    if (r) r.total_points += body.delta;
    return { ok: true };
  }
  const id = url.split("/").pop();
  for (const key of ["merit_log", "sin_log"]) {
    const i = DB[key].findIndex((e) => e.id === id);
    if (i < 0) continue;
    const rec = DB[key][i];
    if (method === "DELETE") {
      DB[key].splice(i, 1);
      const r = DB.ranking.find((m) => m.display_name === rec.display_name);
      if (r) r.total_points -= rec.delta;
    } else if (method === "PATCH") {
      const r = DB.ranking.find((m) => m.display_name === rec.display_name);
      if (r) r.total_points += body.delta - rec.delta;
      rec.delta = body.delta;
      rec.reason = (body.reason || "").trim();
      const wantKey = body.delta > 0 ? "merit_log" : "sin_log";
      if (wantKey !== key) {
        DB[key].splice(i, 1);
        DB[wantKey].unshift(rec);
      }
    }
  }
  return { ok: true };
}

function render(data) {
  state.data = data;
  app.innerHTML =
    section("大餐目標", targetGroup(data.dinner_target)) +
    section(data.dinner_target ? "總排名 · 目前餐費試算" : "總排名", rankingGroup(data.ranking || [])) +
    section("功德紀錄", logGroup("merit", data.merit_log || [], "還沒有人做好事")) +
    section("犯罪紀錄", logGroup("sin", data.sin_log || [], "目前無人犯案")) +
    `<p class="foot">右上角「記一筆」手動加紀錄 · 點任一筆紀錄可修改或刪除</p>`;
}

function section(label, groupHtml) {
  return `<p class="label">${label}</p><div class="group">${groupHtml}</div>`;
}

function targetGroup(amount) {
  const val = amount
    ? `<span class="val strong">$${Number(amount).toLocaleString()}</span>`
    : `<span class="val">未設定</span>`;
  return (
    `<button class="line" data-act="target">` +
    `<iconify-icon class="ico" icon="${ICON.target}"></iconify-icon>` +
    `<span class="main"><div class="name">大餐目標金額</div></span>` +
    val +
    `<iconify-icon class="chev" icon="${ICON.chev}"></iconify-icon>` +
    `</button>`
  );
}

function rankingGroup(members) {
  if (!members.length) return `<p class="row-empty">還沒有人被記點</p>`;
  return members
    .map((m, i) => {
      const p = m.total_points;
      const cls = p > 0 ? "pos" : p < 0 ? "neg" : "zero";
      const money = m.pay == null ? "" : `<span class="money${m.pay < 0 ? " back" : ""}"> ${fmtMoney(m.pay)}</span>`;
      return (
        `<div class="line${i === 0 ? " first" : ""}">` +
        `<span class="rank">${i + 1}</span>` +
        `<span class="main"><div class="name">${escapeHtml(m.display_name)}</div></span>` +
        `<span class="trail"><span class="pts big ${cls}">${p > 0 ? "+" : ""}${p}</span>${money}</span>` +
        `</div>`
      );
    })
    .join("");
}

function logGroup(kind, entries, emptyText) {
  if (!entries.length) return `<p class="row-empty">${escapeHtml(emptyText)}</p>`;
  return entries
    .map((e) => {
      const cls = e.delta > 0 ? "pos" : "neg";
      const sub = e.reason ? `<div class="sub">${escapeHtml(e.reason)}</div>` : "";
      return (
        `<button class="line" data-kind="${kind}" data-id="${escapeHtml(e.id)}">` +
        `<span class="main"><div class="name">${escapeHtml(e.display_name)}</div>${sub}</span>` +
        `<span class="trail"><span class="pts ${cls}">${e.delta > 0 ? "+" : ""}${e.delta}</span>` +
        `<span class="meta">${fmtDate(e.created_at)}</span></span>` +
        `<iconify-icon class="chev" icon="${ICON.chev}"></iconify-icon>` +
        `</button>`
      );
    })
    .join("");
}

/* ---- sheets ---- */

function mountSheet(html) {
  const el = document.createElement("div");
  el.className = "backdrop";
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  const close = () => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 240);
  };
  el.addEventListener("click", (ev) => {
    if (ev.target === el) close();
  });
  return { el, close };
}

function wireStep(el, initial) {
  let v = initial;
  const vEl = el.querySelector(".v");
  const paint = () => {
    vEl.textContent = (v > 0 ? "+" : "") + v;
    vEl.className = "v " + (v > 0 ? "pos" : "neg");
  };
  el.querySelectorAll("[data-step]").forEach((b) =>
    b.addEventListener("click", () => {
      const s = Number(b.dataset.step);
      v += s;
      if (v === 0) v += s;
      v = Math.max(-99, Math.min(99, v));
      paint();
    })
  );
  paint();
  return () => v;
}

const STEP_HTML =
  `<div class="step">` +
  `<button type="button" data-step="-1"><iconify-icon icon="lucide:minus"></iconify-icon></button>` +
  `<span class="v"></span>` +
  `<button type="button" data-step="1"><iconify-icon icon="lucide:plus"></iconify-icon></button>` +
  `</div>`;

const setBusy = (el, on) => el.querySelectorAll("button").forEach((b) => (b.disabled = on));

function openEditSheet(kind, id) {
  const list = kind === "merit" ? state.data.merit_log : state.data.sin_log;
  const rec = (list || []).find((e) => String(e.id) === id);
  if (!rec) return;

  const { el, close } = mountSheet(
    `<h3><iconify-icon icon="lucide:pencil"></iconify-icon>編輯紀錄 · ${escapeHtml(rec.display_name)}</h3>
     <div class="fld"><span>點數</span>${STEP_HTML}</div>
     <div class="fld"><span>事蹟</span><input type="text" class="reason" maxlength="60" placeholder="原因"></div>
     <div class="acts">
       <button class="btn ghost" type="button" data-del><iconify-icon icon="lucide:trash-2"></iconify-icon>刪除</button>
       <button class="btn primary" type="button" data-save>儲存</button>
     </div>
     <p class="err"></p>`
  );
  const getDelta = wireStep(el, rec.delta);
  const reason = el.querySelector(".reason");
  const err = el.querySelector(".err");
  reason.value = rec.reason || "";

  el.querySelector("[data-save]").addEventListener("click", async () => {
    setBusy(el, true);
    err.textContent = "";
    try {
      await api("PATCH", `/api/records/${rec.id}`, { delta: getDelta(), reason: reason.value });
      close();
      await reload();
    } catch (e) {
      err.textContent = e.message;
      setBusy(el, false);
    }
  });
  el.querySelector("[data-del]").addEventListener("click", async () => {
    if (!confirm("刪除這筆紀錄？")) return;
    setBusy(el, true);
    err.textContent = "";
    try {
      await api("DELETE", `/api/records/${rec.id}`);
      close();
      await reload();
    } catch (e) {
      err.textContent = e.message;
      setBusy(el, false);
    }
  });
}

function openAddSheet() {
  const members = state.data.members || [];
  if (!members.length) return alert("還沒有任何成員可以記點");
  const opts = members
    .map((m) => `<option value="${escapeHtml(m.line_user_id)}">${escapeHtml(m.display_name)}</option>`)
    .join("");

  const { el, close } = mountSheet(
    `<h3><iconify-icon icon="lucide:plus"></iconify-icon>手動記一筆</h3>
     <div class="fld"><span>對象（限名單上的人）</span><select class="member">${opts}</select></div>
     <div class="fld"><span>點數</span>${STEP_HTML}</div>
     <div class="fld"><span>事蹟</span><input type="text" class="reason" maxlength="60" placeholder="原因"></div>
     <div class="acts"><button class="btn primary" type="button" data-save>新增</button></div>
     <p class="err"></p>`
  );
  const getDelta = wireStep(el, 1);
  const member = el.querySelector(".member");
  const reason = el.querySelector(".reason");
  const err = el.querySelector(".err");

  el.querySelector("[data-save]").addEventListener("click", async () => {
    setBusy(el, true);
    err.textContent = "";
    try {
      await api("POST", "/api/records", {
        line_group_id: state.groupId,
        target_user_id: member.value,
        delta: getDelta(),
        reason: reason.value,
      });
      close();
      await reload();
    } catch (e) {
      err.textContent = e.message;
      setBusy(el, false);
    }
  });
}

function openTargetSheet() {
  const cur = state.data.dinner_target;
  const { el, close } = mountSheet(
    `<h3><iconify-icon icon="${ICON.target}"></iconify-icon>大餐目標金額</h3>
     <div class="fld"><span>!算帳 不帶數字時就用這個金額</span>
       <input type="number" inputmode="numeric" class="amt" min="1" placeholder="例如 12000"></div>
     <div class="acts"><button class="btn primary" type="button" data-save>儲存</button></div>
     <p class="err"></p>`
  );
  const amt = el.querySelector(".amt");
  const err = el.querySelector(".err");
  if (cur) amt.value = cur;

  el.querySelector("[data-save]").addEventListener("click", async () => {
    const amount = parseInt(amt.value, 10);
    if (!amount || amount <= 0) {
      err.textContent = "請輸入大於 0 的金額";
      return;
    }
    setBusy(el, true);
    err.textContent = "";
    try {
      await api("PUT", "/api/target", { line_group_id: state.groupId, amount });
      close();
      await reload();
    } catch (e) {
      err.textContent = e.message;
      setBusy(el, false);
    }
  });
}

function fmtMoney(n) {
  const s = "$" + Math.abs(n).toLocaleString();
  return n < 0 ? "退 " + s : s;
}

function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s);
  return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
